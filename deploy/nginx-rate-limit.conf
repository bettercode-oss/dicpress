# 인증 관련 경로의 속도 제한 (#104).
#
# 설치 위치: /etc/nginx/conf.d/dicpress-rate-limit.conf
# **`http` 블록 안이어야 한다.** `limit_req_zone` 은 server·location 에 둘 수 없다.
# `nginx.conf` 가 `conf.d/*.conf` 를 http 안에서 include 하므로 여기가 맞는 자리다.
#
# ## 무엇을 막나 — 계정 열거
#
# 로그인하지 않고도 이메일 하나로 "이 사람이 여기 있는가" 를 알 수 있는 지점들이 있다.
#
#   /api/auth/webauthn/…   404 "등록된 Passkey 없음" — 계정 존재 + ACTIVE 여부
#   /api/admin/signup      409 "이미 신청/승인된 이메일" — 신청·승인 상태
#
# 응답을 통일하는 방법(선택지 A)은 UX 를 해친다 — "등록된 Passkey 가 없다" 를 못 알려주면
# 사용자가 헤맨다. 사내 도구에서 그 대가는 크다. 그래서 **표면은 두고 대량 조회만 비싸게**
# 만드는 쪽을 골랐다(선택지 B). 한 명이 자기 계정을 쓰는 데는 걸리지 않고, 수백 개
# 주소를 훑는 일만 몇십 분짜리가 된다.
#
# ## 숫자의 근거
#
# 로그인 한 번은 요청 두 개다(options → verify). 재시도까지 쳐도 사람은 한 자릿수다.
# burst 20 이면 사무실 NAT 뒤에서 여러 명이 동시에 로그인해도 걸리지 않는다.
# 그 뒤로는 2초에 하나 — 1000개 주소를 훑으면 30분이 넘는다.
#
# `nodelay` 를 쓰는 이유: 없으면 burst 안의 요청을 큐에 넣고 **천천히 흘려보낸다.**
# 사람 입장에서는 로그인이 몇 초씩 멈춘 것처럼 보인다. nodelay 는 burst 를 즉시 통과시키고
# 초과분만 거절하므로, 정상 사용자는 지연을 겪지 않고 공격자만 429 를 받는다.
limit_req_zone $binary_remote_addr zone=dic_auth:10m rate=30r/m;

# 기본값은 503 이다. 503 은 "서버가 아픔" 이고 지금 상황은 "너무 빠름" 이라 429 가 맞다.
# 클라이언트가 재시도 정책을 고를 때도 이 구분이 의미가 있다.
limit_req_status 429;

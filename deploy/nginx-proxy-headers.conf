# dicpress 프록시 공통 헤더.
#
# 설치 위치: /etc/nginx/snippets/dicpress-proxy.conf
# 프록시하는 **모든** location 이 이 파일을 include 한다.
#
# ## 왜 파일로 뺐나
#
# `proxy_set_header` 는 **상속이 아니라 치환**이다. 어떤 location 에 이 지시자가 하나라도
# 있으면 상위 레벨의 목록을 전부 버리고, 형제 location 끼리는 애초에 상속 관계가 없다.
# 그래서 프록시하는 블록을 새로 만들 때마다 이 목록을 통째로 복사해야 했다.
#
# 복사가 늘어날수록 한 곳이 조용히 뒤처진다. 그리고 그 한 줄이 하필
# `Authorization ""` 이면 **서비스 토큰 경로가 공개 인터넷에 열린다.**
# 배포마다 도는 `scripts/verify-auth-boundary.sh` 는 `/api/documents` 만 보므로
# 다른 블록에서 빠진 것은 잡지 못한다.
#
# include 는 그 함정을 없앤다. 파일이 없으면 `nginx -t` 가 **크게 실패**하므로
# 조용히 어긋나지 않는다.

# 클라이언트가 보낸 Authorization 을 버린다.
#
# 이 앱은 브라우저에서 Authorization 헤더를 한 번도 쓰지 않는다 — 관리자 UI 는 전부
# 세션 쿠키다. 반면 서버 간 호출(admin.bizos.kr 콘솔)은 이 헤더에 ADMIN_SERVICE_TOKEN 을
# 실어 보내고, 그 토큰을 쥔 쪽은 X-Actor-Email 로 아무나 사칭할 수 있다.
#
# 여기서 비우면 토큰 경로가 공개 인터넷에서 물리적으로 도달 불가능해지고, 루프백으로
# 들어오는 콘솔에서만 살아 있다. 지우면 토큰이 인터넷에 노출된다.
proxy_set_header   Authorization     "";

proxy_http_version 1.1;
proxy_set_header   Upgrade           $http_upgrade;
proxy_set_header   Connection        'upgrade';
proxy_set_header   Host              $host;
proxy_set_header   X-Real-IP         $remote_addr;
proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header   X-Forwarded-Proto $scheme;
proxy_cache_bypass $http_upgrade;
proxy_read_timeout 60s;

name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── CI: 타입 체크 + 린트 ──────────────────────────────────────────
  ci:
    name: Type check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

  # ─── Deploy: main 브랜치 push 시에만 실행 ─────────────────────────
  deploy:
    name: Deploy to Cafe24
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      # 배포 자체는 SSH 로 서버에서 돌지만, 마지막 경계 검사 스크립트는 러너에서
      # 실행하므로 저장소가 필요하다.
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}

            echo "▶ 최신 코드 가져오기..."
            git fetch origin main && git reset --hard origin/main

            echo "▶ 의존성 설치..."
            npm ci

            echo "▶ Prisma 클라이언트 생성..."
            npx prisma generate

            echo "▶ DB 마이그레이션..."
            npx prisma migrate deploy

            echo "▶ 빌드 정보 주입..."
            export NEXT_PUBLIC_GIT_SHA=$(git rev-parse --short HEAD)
            export NEXT_PUBLIC_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            export NEXT_PUBLIC_APP_VERSION=$(node -p "require('./package.json').version")
            export NEXT_PUBLIC_REPO_URL="https://github.com/${{ github.repository }}"

            echo "▶ 프로덕션 빌드..."
            NODE_ENV=production npm run build

            echo "▶ standalone 정적 파일 복사..."
            cp -r public .next/standalone/public
            cp -r .next/static .next/standalone/.next/static

            echo "▶ PM2 재시작 (무중단)..."
            pm2 reload dicpress || pm2 start ecosystem.config.js --env production

            echo "▶ 헬스체크..."
            sleep 3
            curl -sf http://127.0.0.1:${{ secrets.PORT }}/api/health || (pm2 logs dicpress --lines 20 && exit 1)

            echo "✅ 배포 완료"

      - name: Verify deployment
        run: |
          sleep 5
          EXPECTED="${{ github.sha }}"
          EXPECTED_SHORT="${EXPECTED:0:7}"
          DEPLOYED=$(curl -sf https://dic.bizos.kr/api/version | grep -o '"gitSha":"[^"]*"' | cut -d'"' -f4)
          if [ "$DEPLOYED" != "$EXPECTED_SHORT" ]; then
            echo "⚠️ 배포된 SHA($DEPLOYED)가 예상($EXPECTED_SHORT)과 다릅니다"
            exit 1
          fi
          echo "✅ 배포 확인 완료: $DEPLOYED"

      # 관리자 API 의 보안 경계(nginx 가 Authorization 을 비우는 것)가 살아 있는지 확인한다.
      # 그 설정은 서버에만 있고 CI 가 배포하지 않아서, 조용히 사라져도 알 방법이 없다.
      #
      # 실패해도 롤백하지 않는다 — 이미 배포된 코드 자체는 정상이고, 문제는 nginx 설정이다.
      # 되돌린다고 고쳐지지 않으므로 워크플로만 실패시켜 사람을 부른다.
      - name: Verify auth boundary
        env:
          ADMIN_SERVICE_TOKEN: ${{ secrets.ADMIN_SERVICE_TOKEN }}
        run: ./scripts/verify-auth-boundary.sh
